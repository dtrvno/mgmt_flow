services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mgmtflow
      POSTGRES_PASSWORD: mgmtflow
      POSTGRES_DB: mgmtflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgmtflow -d mgmtflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mgmtflow:mgmtflow@db:5432/mgmtflow
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3000
    ports:
      - "3000:3000"

  engine:
    build: .
    command: ["node", "engine.js"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mgmtflow:mgmtflow@db:5432/mgmtflow
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  rabbitmq_data:
