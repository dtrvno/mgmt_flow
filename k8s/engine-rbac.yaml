apiVersion: v1
kind: ServiceAccount
metadata:
  name: mgmt-flow-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mgmt-flow-engine-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mgmt-flow-engine-binding
subjects:
  - kind: ServiceAccount
    name: mgmt-flow-engine
roleRef:
  kind: Role
  name: mgmt-flow-engine-role
  apiGroup: rbac.authorization.k8s.io
